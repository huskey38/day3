<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 관광지 지도</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
    <style>
        body { margin: 0; font-family: sans-serif; }
        #bar { padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        #status { color: #555; font-size: 14px; }
        #map { height: calc(100vh - 52px); }
    </style>
</head>
<body>
    <div id="bar">
        <label>지역
            <select id="area">
                <option>동쪽</option>
                <option>서쪽</option>
                <option>서귀포</option>
                <option>제주시</option>
            </select>
        </label>
        <label>실내/야외
            <select id="indoor">
                <option value="">전체</option>
                <option value="true">실내</option>
                <option value="false">야외</option>
            </select>
        </label>
        <button id="search">찾기</button>
        <span id="status"></span>
    </div>
    <div id="map"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        const MAX_RESULTS = 8
        const map = L.map("map").setView([33.38, 126.55], 10)   // 제주도 중심
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map)
        const markers = L.layerGroup().addTo(map)
        const statusEl = document.getElementById("status")

        let spots = []

        // api/tools.js 의 find_spots 와 같은 규칙 (브라우저에서는 require 를 쓸 수 없어 옮겨 적음)
        const findSpots = (area, indoor) =>
            spots.filter(s => s.area.startsWith(area) && (indoor === undefined || s.indoor === indoor))
                 .slice(0, MAX_RESULTS)

        // jeju_spots.json 에는 좌표가 없어서 OpenStreetMap Nominatim 으로 이름을 좌표로 바꾼다.
        // 제주도 범위 안에서만 검색하고, 결과는 localStorage 에 저장해 다시 요청하지 않는다.
        const geocode = async (name) => {
            const key = "geo:" + name
            const saved = localStorage.getItem(key)
            if (saved) return JSON.parse(saved)
            const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr" +
                "&viewbox=126.1,33.6,127.0,33.1&bounded=1&q=" + encodeURIComponent(name)
            const res = await fetch(url)
            const found = (await res.json())[0]
            const pos = found ? [Number(found.lat), Number(found.lon)] : null
            localStorage.setItem(key, JSON.stringify(pos))
            return pos
        }

        const sleep = (ms) => new Promise(r => setTimeout(r, ms))

        const search = async () => {
            const area = document.getElementById("area").value
            const v = document.getElementById("indoor").value
            const indoor = v === "" ? undefined : v === "true"
            markers.clearLayers()

            const result = findSpots(area, indoor)
            const bounds = []
            const missing = []
            for (const [n, s] of result.entries()) {
                statusEl.textContent = `좌표 찾는 중... ${n + 1}/${result.length}`
                const cached = localStorage.getItem("geo:" + s.name) !== null
                const pos = await geocode(s.name)
                if (!cached) await sleep(1100)   // Nominatim 이용 규칙: 초당 1회 이하
                if (!pos) { missing.push(s.name); continue }

                const box = document.createElement("div")
                const title = document.createElement("b")
                title.textContent = s.name
                box.append(title, document.createElement("br"),
                    `${s.area} · ${s.indoor ? "실내" : "야외"} · ${s.type}`)
                L.marker(pos).addTo(markers).bindPopup(box)
                bounds.push(pos)
            }
            if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 })
            statusEl.textContent = `${bounds.length}곳 표시` +
                (missing.length ? ` (좌표를 못 찾음: ${missing.join(", ")})` : "")
        }

        document.getElementById("search").addEventListener("click", search)
        fetch("jeju_spots.json")
            .then(r => r.json())
            .then(d => { spots = d.spots; statusEl.textContent = `${spots.length}곳 불러옴` })
            .catch(() => { statusEl.textContent = "jeju_spots.json 을 못 불러왔습니다. 웹 서버로 열어주세요." })
    </script>
</body>
</html>
