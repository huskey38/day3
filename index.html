<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 지진 지구본</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; color: #eee; font-family: sans-serif; overflow: hidden; }
        #globe { position: fixed; inset: 0; }
        #panel { position: fixed; top: 12px; left: 12px; width: 260px; max-width: calc(100vw - 24px); padding: 12px 14px;
                 background: rgba(10, 10, 20, 0.75); border: 1px solid #333; border-radius: 8px; font-size: 13px; }
        #panel h1 { margin: 0 0 4px; font-size: 16px; }
        #panel p { margin: 2px 0; color: #aaa; }
        #list { margin: 8px 0 0; padding: 0; list-style: none; }
        #list li { padding: 4px 0; border-top: 1px solid #333; cursor: pointer; }
        #list b { color: #ff6b4a; }
        #credit { position: fixed; bottom: 8px; right: 12px; font-size: 11px; color: #888; }
        #credit a { color: #aaa; }
    </style>
</head>
<body>
    <div id="globe"></div>
    <div id="panel">
        <h1>실시간 지진 지구본</h1>
        <p id="status">불러오는 중...</p>
        <p>최근 24시간 · 1분마다 갱신 · 크기가 클수록 큰 지진</p>
        <ul id="list"></ul>
    </div>
    <div id="credit">지진 데이터: <a href="https://earthquake.usgs.gov/">USGS</a></div>

    <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.34.4/dist/globe.gl.min.js"></script>
    <script>
        const FEED = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson"
        const statusEl = document.getElementById("status")
        const listEl = document.getElementById("list")

        // 규모에 따라 노랑 → 주황 → 빨강
        const color = (mag) => mag >= 6 ? "#ff1744" : mag >= 5 ? "#ff6b4a" : mag >= 4 ? "#ffb300" : "#ffee58"

        const globe = Globe()(document.getElementById("globe"))
            .globeImageUrl("https://unpkg.com/three-globe@2.31.0/example/img/earth-night.jpg")
            .bumpImageUrl("https://unpkg.com/three-globe@2.31.0/example/img/earth-topology.png")
            .backgroundImageUrl("https://unpkg.com/three-globe@2.31.0/example/img/night-sky.png")
            .pointLat("lat").pointLng("lng")
            .pointAltitude(d => Math.max(d.mag, 0) * 0.02)
            .pointRadius(d => Math.max(d.mag, 0.5) * 0.08)
            .pointColor(d => color(d.mag))
            .pointLabel(d => `<b>M ${d.mag}</b><br>${d.place}<br>${new Date(d.time).toLocaleString("ko-KR")}`)
            .ringLat("lat").ringLng("lng")
            .ringColor(d => () => color(d.mag))
            .ringMaxRadius(d => Math.max(d.mag, 1) * 1.5)
            .ringPropagationSpeed(2)
            .ringRepeatPeriod(1500)

        globe.controls().autoRotate = true
        globe.controls().autoRotateSpeed = 0.4

        const load = async () => {
            try {
                const res = await fetch(FEED)
                const quakes = (await res.json()).features
                    .filter(f => f.properties.mag !== null)
                    .map(f => ({
                        lng: f.geometry.coordinates[0],
                        lat: f.geometry.coordinates[1],
                        mag: f.properties.mag,
                        place: f.properties.place,
                        time: f.properties.time
                    }))
                globe.pointsData(quakes)
                globe.ringsData(quakes.filter(q => q.mag >= 2.5))   // 작은 지진까지 모두 퍼뜨리면 어지러워서 제외

                const top = [...quakes].sort((a, b) => b.mag - a.mag).slice(0, 5)
                listEl.replaceChildren(...top.map(q => {
                    const li = document.createElement("li")
                    const b = document.createElement("b")
                    b.textContent = "M " + q.mag
                    li.append(b, " " + q.place)
                    li.addEventListener("click", () => {
                        globe.controls().autoRotate = false
                        globe.pointOfView({ lat: q.lat, lng: q.lng, altitude: 1.5 }, 1000)
                    })
                    return li
                }))
                statusEl.textContent = `최근 24시간 지진 ${quakes.length}건 · ${new Date().toLocaleTimeString("ko-KR")} 갱신`
            } catch (e) {
                statusEl.textContent = "지진 데이터를 불러오지 못했습니다."
            }
        }

        load()
        setInterval(load, 60000)
        window.addEventListener("resize", () => globe.width(innerWidth).height(innerHeight))
    </script>
</body>
</html>
