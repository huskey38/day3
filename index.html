<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 여행 추천 에이전트</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #f4f7fa; color: #222; }
        main { max-width: 720px; margin: 0 auto; padding: 16px; }
        h1 { font-size: 20px; margin: 8px 0 4px; }
        .sub { color: #666; font-size: 14px; margin: 0 0 12px; }
        form { display: flex; gap: 8px; }
        input { flex: 1; padding: 10px; font-size: 15px; border: 1px solid #bbb; border-radius: 6px; }
        button { padding: 10px 16px; font-size: 15px; border: 0; border-radius: 6px; background: #0b7285; color: #fff; cursor: pointer; }
        button:disabled { background: #999; cursor: wait; }
        .examples { margin: 8px 0 16px; display: flex; gap: 6px; flex-wrap: wrap; }
        .examples button { background: #e3edf2; color: #0b4a58; font-size: 13px; padding: 6px 10px; }
        .msg { background: #fff; border-radius: 8px; padding: 12px 14px; margin: 10px 0; white-space: pre-wrap; line-height: 1.5; }
        .msg.user { background: #d0ebff; }
        .tool { background: #fff9db; border-left: 4px solid #f08c00; border-radius: 4px; padding: 8px 12px; margin: 6px 0; font-size: 13px; }
        .tool summary { cursor: pointer; font-weight: bold; }
        .tool pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow: auto; }
        .err { color: #c92a2a; }
    </style>
</head>
<body>
<main>
    <h1>제주 여행 추천 에이전트</h1>
    <p class="sub">질문하면 에이전트가 <b>get_weather</b>(Open-Meteo)와 <b>find_spots</b>(관광지 목록)를 스스로 골라 호출해 추천합니다.</p>
    <form id="form">
        <input id="q" placeholder="예: 내일 서귀포에서 갈 만한 곳 추천해줘" maxlength="500" autocomplete="off">
        <button id="send">물어보기</button>
    </form>
    <div class="examples">
        <button type="button">오늘 제주시에서 뭐 하면 좋을까?</button>
        <button type="button">내일 동쪽에서 갈 만한 곳 추천해줘</button>
        <button type="button">서쪽 여행인데 비 오면 어디가 좋아?</button>
    </div>
    <div id="log"></div>
</main>

<script>
    const form = document.getElementById("form")
    const q = document.getElementById("q")
    const send = document.getElementById("send")
    const log = document.getElementById("log")

    const add = (cls, text) => {
        const div = document.createElement("div")
        div.className = cls
        div.textContent = text
        log.append(div)
        return div
    }

    // 에이전트가 호출한 도구와 입력·결과를 접어서 보여준다.
    const addTool = (step) => {
        const box = document.createElement("details")
        box.className = "tool"
        const sum = document.createElement("summary")
        sum.textContent = `도구 호출: ${step.tool}(${JSON.stringify(step.input)})`
        const pre = document.createElement("pre")
        pre.textContent = JSON.stringify(step.output, null, 2)
        box.append(sum, pre)
        log.append(box)
    }

    const ask = async (text) => {
        add("msg user", text)
        const wait = add("msg", "에이전트가 도구를 고르는 중...")
        send.disabled = true
        try {
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ message: text })
            })
            const data = await res.json()
            wait.remove()
            if (!res.ok) throw new Error(data.error || "요청 실패")
            data.steps.forEach(addTool)
            add("msg", data.answer)
        } catch (e) {
            wait.remove()
            add("msg err", "오류: " + e.message)
        } finally {
            send.disabled = false
        }
    }

    form.addEventListener("submit", (e) => {
        e.preventDefault()
        const text = q.value.trim()
        if (!text) return
        q.value = ""
        ask(text)
    })
    document.querySelectorAll(".examples button").forEach(b =>
        b.addEventListener("click", () => ask(b.textContent)))
</script>
</body>
</html>
